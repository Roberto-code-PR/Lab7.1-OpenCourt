<script>
let posts=JSON.parse(localStorage.getItem('oc_posts')||'[]');
if(posts.length==0) posts=[{title:"5AM at Robert's Court",content:"100 threes before class",author:"Roberto L."}];
function render(){document.getElementById('postsList').innerHTML=posts.map(p=>`<div class='bg-dark p-3 mb-2 border border-secondary'><h5>${p.title}</h5><p>${p.content}</p><small class="text-secondary">${p.author}</small></div>`).join('');}
render();
