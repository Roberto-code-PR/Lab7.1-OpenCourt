<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CONTACT - OPEN COURT</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<header class="header py-3 sticky-top"><div class="container-fluid px-4 d-flex justify-content-between align-items-center"><h1 style="font-family:Impact;">OPEN COURT</h1><nav class="nav"><a class="nav-link" href="index.html">HOME</a><a class="nav-link" href="about.html">ABOUT</a><a class="nav-link" href="news.html">NEWS</a><a class="nav-link" href="community.html">COMMUNITY</a><a class="nav-link" href="write.html">WRITE</a><a class="nav-link" href="gear.html">GEAR</a><a class="nav-link" href="gallery.html">GALLERY</a><a class="nav-link active" href="contact.html">CONTACT</a></nav></div></header>
<main><section class="container py-5"><h2>CONTACT</h2><form id="contactForm" class="bg-dark p-4"><label>Name</label><input id="cName" class="form-control" oninput="validateField('cName')"><small id="cNameError" class="text-danger"></small><label class="mt-3">Email</label><input id="cEmail" class="form-control" oninput="validateField('cEmail')"><small id="cEmailError" class="text-danger"></small><label class="mt-3">Message</label><textarea id="cMsg" class="form-control" oninput="validateField('cMsg')"></textarea><small id="cMsgError" class="text-danger"></small><button class="btn btn-danger w-100 mt-3">Send</button></form></section></main>
<footer class="py-4 text-center small text-secondary">© 2026 OPEN COURT</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function validateField(id){let v=document.getElementById(id).value.trim(), err=''; if(id==='cName'&&v.length<2) err='Minimum 2 chars'; if(id==='cEmail'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) err='Invalid email'; if(id==='cMsg'&&v.length<10) err='Minimum 10 chars'; document.getElementById(id+'Error').innerText=err; return err=='';}
document.getElementById('contactForm').addEventListener('submit', e=>{e.preventDefault(); if(validateField('cName')&&validateField('cEmail')&&validateField('cMsg')) alert('Sent - Roberto L. 2026');});
</script></body></html>
