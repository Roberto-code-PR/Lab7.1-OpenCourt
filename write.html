<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WRITE - OPEN COURT</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<header class="header py-3 sticky-top"><div class="container-fluid px-4 d-flex justify-content-between align-items-center"><h1 style="font-family:Impact;">OPEN COURT</h1><nav class="nav"><a class="nav-link" href="index.html">HOME</a><a class="nav-link" href="about.html">ABOUT</a><a class="nav-link" href="news.html">NEWS</a><a class="nav-link" href="community.html">COMMUNITY</a><a class="nav-link active" href="write.html">WRITE</a><a class="nav-link" href="gear.html">GEAR</a><a class="nav-link" href="gallery.html">GALLERY</a><a class="nav-link" href="contact.html">CONTACT</a></nav></div></header>
<main><section class="container py-5"><h2>WRITE YOUR TAKE</h2><form id="writeForm" class="bg-dark p-4"><input id="wTitle" class="form-control mb-2" placeholder="Title" required><textarea id="wContent" class="form-control mb-2" placeholder="Your story..." required></textarea><button class="btn btn-danger w-100">Publish</button></form></section></main>
<footer class="py-4 text-center small text-secondary">© 2026 OPEN COURT</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('writeForm').addEventListener('submit', e=>{
e.preventDefault();
let posts=JSON.parse(localStorage.getItem('oc_posts')||'[]');
posts.unshift({title:wTitle.value, content:wContent.value, author:"Roberto L."});
localStorage.setItem('oc_posts',JSON.stringify(posts));
alert('Published - Roberto L. 2026'); window.location.href='community.html';
});
</script></body></html>
